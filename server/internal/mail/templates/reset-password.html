<html>

<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rubik';
    }

    :root {
      --color-primary: oklch(51.1% 0.262 276.966);
      --color-muted: oklch(25.7% 0.09 281.288);
      --color-muted-foreground: oklch(0.552 0.016 285.938);
    }

    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-items: center;
      background: color-mix(in oklab, var(--primary) 5%, transparent) !important;
      font-size: 16px;
      color: var(--color-muted-foreground);
      text-align: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }

    div {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    svg {
      height: 32px;
      width: 32px;
      stroke: var(--color-muted);
    }

    h1 {
      font-size: 28px;
      color: var(--color-muted);
    }

    button {
      background: var(--color-primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <main>
    <div>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-house-plus-icon lucide-house-plus">
        <path d="M12.35 21H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v2.35" />
        <path d="M14.8 12.4A1 1 0 0 0 14 12h-4a1 1 0 0 0-1 1v8" />
        <path d="M15 18h6" />
        <path d="M18 15v6" />
      </svg>
      <h1>Imobiliary</h1>
    </div>
    <section>
      <p>Clique no botão abaixo para redefinir sua senha para<br>
        acesso a plataforma do imobiliary</p>
      <a href="www.google.com" referrerpolicy="off">
        <button>
          Redefinir Senha
        </button>
      </a>
    </section>
  </main>
</body>

</html>
