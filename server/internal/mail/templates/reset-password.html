<html>
	<head>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme {
				--font-sans: "Rubik";
				--color-primary: oklch(51.1% 0.262 276.966);
				--color-muted: oklch(25.7% 0.09 281.288);
				--color-muted-foreground: oklch(0.552 0.016 285.938);
			}
		</style>
	</head>

	<body
		class="bg-background h-screen w-screen flex items-center justify-center"
	>
		<main class="flex flex-col items-center gap-2">
			<div class="flex items-center gap-2">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					width="24"
					height="24"
					viewBox="0 0 24 24"
					fill="none"
					stroke="oklch(25.7% 0.09 281.288)"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					class="lucide lucide-house-plus-icon lucide-house-plus"
				>
					<path
						d="M12.35 21H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v2.35"
					/>
					<path d="M14.8 12.4A1 1 0 0 0 14 12h-4a1 1 0 0 0-1 1v8" />
					<path d="M15 18h6" />
					<path d="M18 15v6" />
				</svg>

				<h1 class="text-xl font-bold text-muted">Imobiliary</h1>
			</div>

			<p class="text-center">
				Clique no botão abaixo para redefinir sua senha para<br />
				acesso a plataforma do imobiliary
			</p>

			<a href="{{.ResetPwdUrl}}" referrerpolicy="off">
				<button
					class="px-4 py-1 bg-muted text-white rounded-sm cursor-pointer hover:bg-muted/80 transition-colors"
				>
					Redefinir Senha
				</button>
			</a>
		</main>
	</body>
</html>
